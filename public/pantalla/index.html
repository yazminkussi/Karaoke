<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karaoke - Pantalla principal</title>
  <link rel="stylesheet" href="/pantalla/pantalla.css" />
</head>
<body>
  <!-- Camara self-view (espejada), siempre corriendo de fondo -->
  <video id="selfCam" autoplay playsinline muted></video>
  <div id="scrim"></div>

  <!-- ESPERANDO -->
  <section class="pantalla" data-estado="ESPERANDO">
    <h1>Sentite un cantante profesional</h1>
    <p class="lead">Acercate para vivir tu era popstar</p>
    <img id="qrOnboard" alt="QR para abrir el control en tu celular" />
    <p class="hint">Escanea para usar tu celular como control</p>
  </section>

  <!-- SELECCIONANDO -->
  <section class="pantalla" data-estado="SELECCIONANDO">
    <h2>Elegi tu cancion</h2>
    <ul id="catalogo"></ul>
    <p class="hint">Scrolleá con la mano / el celular y mantené para confirmar</p>
  </section>

  <!-- CONFIRMADA -->
  <section class="pantalla" data-estado="CONFIRMADA">
    <h2>Preparando el escenario…</h2>
    <p class="lead" id="confirmadaTitulo"></p>
  </section>

  <!-- COUNTDOWN -->
  <section class="pantalla" data-estado="COUNTDOWN">
    <div id="countdownNum">3</div>
  </section>

  <!-- PLAYING -->
  <section class="pantalla" data-estado="PLAYING">
    <div id="feedbackFlash"></div>
    <div id="letraOverlay">
      <p id="lineaActual"></p>
      <p id="lineaSiguiente"></p>
    </div>
  </section>

  <!-- RESULTADO -->
  <section class="pantalla" data-estado="RESULTADO">
    <h1>¡Un exito, popstar!</h1>
    <div id="puntajeFinal">0</div>
    <img id="qrResultado" alt="QR para descargar tu video" />
    <p class="hint">Escanea para llevarte tu video</p>
  </section>

  <audio id="pistaAudio" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/pantalla/pantalla.js"></script>
</body>
</html>
